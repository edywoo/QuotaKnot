<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">QuotaKnot menu bar preview</title>
  <desc id="description">A preview of the Codex five-hour and weekly quota percentages and reset countdowns shown by QuotaKnot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#101a35"/>
      <stop offset="1" stop-color="#1d1242"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14d9e6"/>
      <stop offset="1" stop-color="#3978ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5267ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="34" fill="url(#background)"/>
  <circle cx="1050" cy="70" r="180" fill="#7447ff" opacity="0.10"/>
  <circle cx="110" cy="330" r="180" fill="#11dbe7" opacity="0.08"/>
  <rect x="110" y="36" width="980" height="54" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="145" cy="63" r="12" fill="none" stroke="#26d9e5" stroke-width="6"/>
  <path d="M145 51 A12 12 0 0 1 156 59" fill="none" stroke="#ffb53e" stroke-width="6" stroke-linecap="round"/>
  <text x="175" y="70" fill="#f8fafc" font-size="24" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">5h 72% (2h 14m) · Weekly 85% (6d 21h)</text>
  <circle cx="1042" cy="63" r="5" fill="#d8dee9"/>
  <circle cx="1061" cy="63" r="5" fill="#d8dee9"/>
  <g filter="url(#shadow)">
    <rect x="250" y="112" width="700" height="224" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <text x="290" y="155" fill="#f8fafc" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Codex usage limits</text>
  <text x="290" y="190" fill="#cbd5e1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">5-hour limit</text>
  <text x="910" y="190" text-anchor="end" fill="#dffcff" font-size="18" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">72% · resets in 2h 14m</text>
  <rect x="290" y="203" width="620" height="9" rx="4.5" fill="#283247"/>
  <rect x="290" y="203" width="446" height="9" rx="4.5" fill="url(#cyan)"/>
  <text x="290" y="249" fill="#cbd5e1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Weekly limit</text>
  <text x="910" y="249" text-anchor="end" fill="#f2e9ff" font-size="18" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">85% · resets in 6d 21h</text>
  <rect x="290" y="262" width="620" height="9" rx="4.5" fill="#283247"/>
  <rect x="290" y="262" width="527" height="9" rx="4.5" fill="url(#violet)"/>
  <line x1="290" y1="292" x2="910" y2="292" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="302" cy="313" r="5" fill="#36d399"/>
  <text x="318" y="319" fill="#94a3b8" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Auto-refresh: questions · responses · every minute</text>
</svg>
